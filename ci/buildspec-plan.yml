# CodeBuild: test, build the Lambda bundles and produce a Terraform plan.
# The output artifact (source + infra/tfplan + Lambda bundles) feeds buildspec-apply.yml
# after the pipeline's manual approval.
#
# Terraform reads the Google client and allowed emails from SSM itself
# (infra/foundation_inputs.tf), so the build role needs ssm:GetParameter on /family-drive/*.
version: 0.2

env:
  variables:
    TF_VERSION: "1.16.6"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "0"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - bash ci/install-terraform.sh
  pre_build:
    commands:
      - npm ci --prefix functions/allowlist
      - npm test --prefix functions/allowlist
      - npm run build --prefix functions/allowlist
      - npm ci --prefix web
      - npm test --prefix web
      - terraform fmt -check -recursive infra
      - bash ci/tf-init.sh
  build:
    commands:
      - terraform -chdir=infra plan -out=tfplan

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - '**/node_modules/**'
    - 'infra/.terraform/**'
