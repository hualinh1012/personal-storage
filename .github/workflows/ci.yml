# Checks every pull request and every push to main: lint, type-check, test and build
# each package, and check the Terraform offline. No AWS credentials: deploying stays in
# CodePipeline (ci/pipeline.sh).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambdas:
    name: Lambdas (functions/allowlist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions/allowlist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # the Lambda runtime (nodejs22.x)
          cache: npm
          cache-dependency-path: functions/allowlist/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: Web app (web)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22" # the documented minimum is 22.12
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # tsc --noEmit + vite build

  terraform:
    name: Terraform (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      - run: terraform -chdir=infra/foundation init -backend=false -input=false
      - run: terraform -chdir=infra/foundation validate
